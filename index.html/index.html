<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Noticias de futebol</title>
        <style>
            header{
                background-color: rgb(63, 40, 206);
                color: #FFFFFF;
            
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
            }
            main{
                background-color: #FFFFFF;
                color: rgb(4, 4, 6);
                max-width: 800px;
                margin: 0 auto;
                display: flex;
            }
            img{
                width: 80px;
                height: 80px;
            }
            p {
                Font-weight: bold;
            }
            
        </style>
    </head>

    <body>
        <header>
            <h1>Meu site de noticias sobre futebol brasileiro</h1>
            <p>Vou compartilhar noticias e curiosidades sobre o futebol brasileiro</p>
        </header>
        <main>
            <img src="Gemini_Generated_Image_fydy63fydy63fydy.png" alt="Ilustração de um emblema circular em tons de azul escuro e claro. No centro, há uma bola de futebol clássica preta e branca com linhas de movimento à esquerda. Na parte inferior, destaca-se o texto "2026 W.C." em letras brancas.">
            <div>

             <h2>Minha primeira publicação</h2>
            <p>Por: Ariel Victor</p>
            <p>Sejam bem vindos ao meu site! Aqui vou compartilhas noticias sobre futebol e campeonatos brasileiros</p>
               <button>❤️ <span>0</span></button>
               <button>👍 <span>0</span></button>
            </div>
            
        </main>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach( function(botao){
        botao.addEventListener("click", botaoClicado);
        function botaoClicado(){
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
       }
    }) 

    
</script>
</html>
